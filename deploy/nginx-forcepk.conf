# ForcePK nginx site — a NEW server block only. Does not modify any existing site.
# Place at /etc/nginx/sites-available/forcepk.conf and symlink into sites-enabled.
# Then: sudo nginx -t && sudo systemctl reload nginx
# TLS: run `sudo certbot --nginx -d forcepk.com -d www.forcepk.com` (edits only this block).

server {
    listen 80;
    listen [::]:80;
    server_name forcepk.com www.forcepk.com;

    # Allow Let's Encrypt HTTP-01 challenge, redirect everything else to HTTPS.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name forcepk.com www.forcepk.com;

    # certbot fills in ssl_certificate / ssl_certificate_key here.

    client_max_body_size 25m;   # candidate document uploads

    # Proxy to the ForcePK container (docker-compose publishes 127.0.0.1:3005).
    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
